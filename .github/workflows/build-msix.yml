name: Build and Package

# This workflow publishes no binaries anywhere, on purpose.
#
# Repilot is a paid app living in a public repo, and it does not work without
# package identity: the Copilot key is claimed through the
# `com.microsoft.windows.copilotkeyprovider` AppExtension in
# Package.appxmanifest, so an unpackaged build cannot be assigned to the key at
# all (Repilot/Pages/HomePage.xaml.cs hides the Assign button and says so). An
# unpackaged build is therefore not a usable product, and there is no honest
# binary to hand the public. Actions artifacts on a public repo need only read
# access to download, which for a public repo means anyone, so a signed MSIX
# cannot be attached there either.
#
# The install route is the Microsoft Store:
# https://apps.microsoft.com/detail/9pb5fj08pnvj
# Anyone who wants to run it from source can build it themselves (docs/development.md).
# The Store package is produced by store-publish.yml, or locally with
# `.\RepilotMSIX\build-msix.ps1 -NoSign`.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-2025

    strategy:
      matrix:
        platform: [x64, ARM64]

    env:
      PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # ── Extract version from Directory.Build.props ─────────────
      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $ver = $props.Project.PropertyGroup[0].Version
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Detected version: $ver"

      # Every language complete and consistent with the XAML, code and catalog. The check does
      # not depend on the platform, so it runs once, on the x64 leg: the job's PLATFORM variable
      # becomes MSBuild's Platform property, and an ARM64 test exe cannot start on this x64 runner.
      - name: Check string resources
        if: matrix.platform == 'x64'
        shell: pwsh
        run: dotnet run --project tests/Repilot.Localization.Tests -c Release

      # ── Generate MSIX visual assets ────────────────────────────
      - name: Generate images
        shell: pwsh
        run: ./RepilotMSIX/generate-msix-images.ps1

      # ── Build the MSIX package ─────────────────────────────────
      # Nothing consumes this package, and that is not a reason to delete the
      # step. It is CI's only check that manifest stamping, makepri, makeappx
      # and signing still work on both platforms; without it, a break in any of
      # them would first surface during a Store submission, which is the
      # slowest and worst place to discover one.
      #
      # It signs with a throwaway self-signed certificate made for this run, with a random
      # password that is never stored (DIST-2, FIX-060). For Microsoft Store uploads, run
      # build-msix.ps1 with -NoSign instead.
      - name: Build MSIX
        shell: pwsh
        run: |
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          Write-Host "::add-mask::$password"
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Repilot-CI" `
            -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfx = Join-Path $env:RUNNER_TEMP "ci-signing.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          & "RepilotMSIX/build-msix.ps1" -Platform $env:PLATFORM -TrustedPfxPath $pfx -TrustedPfxPassword $password
          if ($LASTEXITCODE -ne 0) { Write-Error "build-msix failed"; exit 1 }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # The release carries notes and a tag, nothing downloadable, so `build` is
    # not feeding it anything. It stays a dependency so a tag whose packaging is
    # broken never gets a release announcing it.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for git log)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes from commits
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^v' | sed -n '2p')
          if [ -n "$PREVIOUS_TAG" ]; then RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"; else RANGE="${CURRENT_TAG}"; fi
          BODY=$(git log "$RANGE" --pretty=format:"- %s" --no-merges \
            | grep -vi "^- Bump version" | grep -vi "^- Merge branch")
          if [ -z "$BODY" ]; then BODY="- Maintenance release (no notable changes)"; fi
          {
            echo "RELEASE_BODY<<RELEASE_EOF"
            echo "## What's Changed"
            echo ""
            echo "$BODY"
            echo ""
            echo "## Installing"
            echo ""
            echo "Repilot installs from the [Microsoft Store](https://apps.microsoft.com/detail/9pb5fj08pnvj), which also keeps it up to date. Releases here are notes only and carry no download: the app needs MSIX package identity to be assignable to the Copilot key, so an unpackaged build would not work. To run it from source, see the [development guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/development.md)."
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      # No `files:` here on purpose: see the note at the top of this file.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.RELEASE_BODY }}
          generate_release_notes: true
