name: Build and Package

# On a v* tag: run the gate (CI-4), build the x64 and ARM64 packages, then create the GitHub Release
# from the committed notes (REL-5, REL-6). workflow_dispatch runs the gate and the build only.

# This workflow publishes no binaries anywhere, on purpose (DIST-5).
#
# Repilot is a paid app living in a public repo, and it does not work without
# package identity: the Copilot key is claimed through the
# `com.microsoft.windows.copilotkeyprovider` AppExtension in
# Package.appxmanifest, so an unpackaged build cannot be assigned to the key at
# all (Repilot/Pages/HomePage.xaml.cs hides the Assign button and says so). An
# unpackaged build is therefore not a usable product, and there is no honest
# binary to hand the public. Actions artifacts on a public repo need only read
# access to download, which for a public repo means anyone, so a signed MSIX
# cannot be attached there either.
#
# The install route is the Microsoft Store:
# https://apps.microsoft.com/detail/9pb5fj08pnvj
# Anyone who wants to run it from source can build it themselves (docs/development.md).
# The Store package is produced by store-publish.yml, or locally with
# `npm run package:desktop` (winui-app-kit's build/build-msix.ps1 -NoSign, driven by windows-build.json).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Creates a GitHub Release, so a run in progress is never cancelled.
concurrency:
  group: build-msix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI-4: the same gate a developer runs, before anything is built or released.
  validate:
    name: Validate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Submodules too: the gate runs winui-app-kit's scripts.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # check:icons runs devkit, which needs Node 22.12 or later, below 25 (the kit's Store workflow uses 24).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate
        run: npm run validate

  build:
    name: Package (${{ matrix.platform }})
    needs: validate
    runs-on: windows-2025
    # Two self-contained publishes, makepri, makeappx and signing; well under this on a warm runner.
    timeout-minutes: 45
    strategy:
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Nothing consumes this package, and that is not a reason to delete the step. It is CI's only
      # check that manifest stamping, makepri, makeappx and signing still work on both platforms;
      # without it, a break would first surface during a Store submission. It signs with a throwaway
      # self-signed certificate made for this run, with a random password that is never stored
      # (DIST-2, FIX-060). The Store package comes from store-publish.yml.
      - name: Build MSIX
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          Write-Host "::add-mask::$password"
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Repilot-CI" `
            -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pfx = Join-Path $env:RUNNER_TEMP "ci-signing.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx `
            -Password (ConvertTo-SecureString -String $password -Force -AsPlainText) | Out-Null
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          & "external/winui-app-kit/build/build-msix.ps1" -Platform $env:PLATFORM -TrustedPfxPath $pfx -TrustedPfxPassword $password
          $buildExit = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($buildExit -ne 0) { Write-Error "build-msix failed"; exit 1 }

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    # A tag gets no Release if the packages it names do not build.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # REL-1, REL-6: the tag must name the version in Directory.Build.props, and the notes must exist
      # for en-US and for every other wording catalog (one sibling per Repilot/Strings folder; en-CA and
      # fr-CA reuse en-US and fr-FR). Each fits the Store's 1,500-character "What's new" limit. Never
      # fall back to commit subjects or generated notes, and never truncate.
      - name: Read version and check notes
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match <Version>${VERSION}</Version> in Directory.Build.props"
            exit 1
          fi
          files=("release-notes/${VERSION}.md")
          for dir in Repilot/Strings/*/; do
            identity="$(basename "${dir}")"
            if [ "${identity}" != "en-US" ]; then files+=("release-notes/${VERSION}.${identity}.md"); fi
          done
          failed=0
          for file in "${files[@]}"; do
            if [ ! -s "${file}" ]; then
              echo "::error::Missing release notes: ${file}"; failed=1
            elif [ "$(wc -m < "${file}")" -gt 1500 ]; then
              echo "::error::${file} is over the Store's 1,500-character limit"; failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then exit 1; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "body<<RELEASE_EOF"
            cat "release-notes/${VERSION}.md"
            echo ""
            echo "## Get it"
            echo ""
            echo "Repilot installs from the [Microsoft Store](https://apps.microsoft.com/detail/9pb5fj08pnvj), which also keeps it up to date. Releases here are notes only and carry no download: the app needs MSIX package identity to be assignable to the Copilot key, so an unpackaged build would not work. To run it from source, see the [development guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/development.md)."
            echo ""
            echo "*AI disclosure: this release and the related code were written with the assistance of AI.*"
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      # Notes and the tag, no assets (see the comment at the top of this file).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Repilot ${{ steps.notes.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          generate_release_notes: false
