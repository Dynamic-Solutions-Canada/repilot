name: CI

# Local copy of the shared CI baseline (CI-10): the reusable workflow it will call does not exist yet,
# so this file follows the baseline and is replaced by a call to it once it does.
#
# The push and pull request gate (CI-1). The Linux job runs the same `npm run validate` a developer
# runs locally, on every push to main and every pull request, with no path filter. The Windows
# compile (CI-3) costs Windows runner minutes, so it runs only when app source, packaging or build
# configuration changed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Submodules too: the gate runs winui-app-kit's scripts, and `dotnet format` loads the app
      # project, which imports the promo page.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # format:check, check:gitignore, check:l10n, then the portable harnesses under tests/.
      - name: Validate
        run: npm run validate

  changes:
    name: Detect Windows-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Plain git instead of a third-party filter action. A push that creates main, or any case
      # where the base cannot be found, compiles rather than guessing.
      - name: Filter paths
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit; compiling."
            echo "windows=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pattern='^(Repilot/|RepilotKey/|RepilotMSIX/|external/|\.gitmodules$|Directory\.Build\.(props|targets)$|global\.json$|Repilot\.slnx$|\.github/workflows/ci\.yml$)'
          if git diff --name-only "${BASE}" HEAD | grep -Eq "${pattern}"; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows=false" >> "$GITHUB_OUTPUT"
          fi

  compile:
    name: Compile (Windows ${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    # A cold restore of the Windows App SDK plus both projects; well under this on a warm runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Called directly: the WSL build bridge that local builds use is not available on a runner.
      # Debug, the same compile `npm run verify:desktop` runs, plus the key handler, which that
      # command does not compile.
      - name: Compile the settings app and the key handler
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          foreach ($project in @('Repilot/Repilot.csproj', 'RepilotKey/RepilotKey.csproj')) {
            dotnet build $project -c Debug "-p:Platform=$env:PLATFORM"
            if ($LASTEXITCODE -ne 0) { throw "Compile failed: $project ($env:PLATFORM)" }
          }
